  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          boxShadow: {
            'emboss': 'inset 1px 1px 2px rgba(255, 255, 255, 0.15), inset -1px -1px 3px rgba(0, 0, 0, 0.8), 0 10px 25px -5px rgba(0, 0, 0, 0.6)',
            'emboss-btn': 'inset 1px 1px 1px rgba(255, 255, 255, 0.25), inset -1px -1px 2px rgba(0, 0, 0, 0.8), 0 4px 12px rgba(0,0,0,0.4)',
            'emboss-card': 'inset 1px 1px 1px rgba(255, 255, 255, 0.12), inset -1px -1px 2px rgba(0, 0, 0, 0.7), 0 12px 28px -5px rgba(0, 0, 0, 0.7)',
            'emboss-active': 'inset 2px 2px 5px rgba(0, 0, 0, 0.9), inset -1px -1px 2px rgba(255, 255, 255, 0.1)'
          }
        }
      }
    }
  </script>

  <style>
    /* Proteksi Seleksi dan Drag Dokumen */
    * {
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
      -webkit-user-drag: none !important;
    }
    input, textarea {
      -webkit-user-select: text !important;
      user-select: text !important;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #0f172a 0%, #030712 90%);
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
      transition: background 0.5s ease;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Efek Kartu Emboss Tactile */
    .card-emboss {
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.75), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 1px 1px 1px rgba(255, 255, 255, 0.12), 
                  inset -1px -1px 2px rgba(0, 0, 0, 0.7),
                  0 12px 30px -8px rgba(0, 0, 0, 0.7);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-emboss:hover {
      transform: translateY(-3px) scale(1.008);
      border-color: rgba(99, 102, 241, 0.45);
      box-shadow: inset 1px 1px 2px rgba(255, 255, 255, 0.2), 
                  0 18px 35px -5px rgba(0, 0, 0, 0.8),
                  0 0 25px rgba(99, 102, 241, 0.25);
    }

    /* Video Background Container */
    #bg-video-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -2;
      overflow: hidden;
      display: none;
    }
    #bg-video {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover;
      filter: brightness(0.35) contrast(1.1);
    }

    /* Ambient Canvas */
    #ambient-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }

    /* Skeleton Loading Animasi */
    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
      background-size: 200% 100%;
      animation: skeleton-loading 1.5s infinite;
    }
    @keyframes skeleton-loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>

  <!-- CORE JAVASCRIPT ENGINE -->
  <script>
    /* =====================================================================
     * 1. PROTEKSI TOTAL: BOT FILTER, ANTI-INSPECT, ANTI-COPY, DEBUGGER TRAP
     * ===================================================================== */
    (function initSecurityShield() {
      // Deteksi Bot & Automated Runner (Puppeteer, Selenium, Phantom)
      const isBot = navigator.webdriver || 
                    window.__nightmare || 
                    window.callPhantom || 
                    window._phantom || 
                    /HeadlessChrome|spider|bot|crawl/i.test(navigator.userAgent);

      if (isBot) {
        document.documentElement.innerHTML = "<h2 style='color:#fff;text-align:center;margin-top:20%'>403 - Akses Ditolak</h2>";
        throw new Error("Bot access rejected.");
      }

      // Blokir Klik Kanan & Seleksi Konteks
      document.addEventListener('contextmenu', e => e.preventDefault());

      // Blokir Drag Objek Gambar & Link
      document.addEventListener('dragstart', e => e.preventDefault());

      // Blokir Tombol Pintas Devtools & View Source
      document.addEventListener('keydown', e => {
        if (
          e.key === 'F12' ||
          (e.ctrlKey && e.shiftKey && ['I','i','J','j','C','c'].includes(e.key)) ||
          (e.ctrlKey && ['U','u','S','s','P','p'].includes(e.key))
        ) {
          e.preventDefault();
          return false;
        }
      });

      // Anti-Debugger Loop (Constructor Trap)
      setInterval(() => {
        (function() { return false; }["constructor"]("debugger")());
      }, 1000);
    })();

    /* =====================================================================
     * 2. ZERO STORAGE ARCHITECTURE & ENCRYPTED GAS ENDPOINT
     * ===================================================================== */
    // Endpoint GAS Terfragmentasi & Ter-obfuscate Base64
    const _segA = "aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy8=";
    const _segB = "QUtmeWNieV9La3hfeTF3YnhvbzFiMDdlelVzTFN5VFVpSUFnU0hTRk5JSlliZlRwcWdjUk1rSE1vUVFzTXRpTkRLRFNEUDBTQQ==";
    const _segC = "L2V4ZWM=";
    const GAS_ENDPOINT = atob(_segA) + atob(_segB) + atob(_segC);

    // Runtime Session Murni di Memori RAM (Tanpa localStorage / sessionStorage)
    const RUNTIME_SID = 'mem_' + Math.random().toString(36).substring(2, 9) + '_' + Date.now().toString(36);

    // State Lokal RAM (Default kosong, diisi 100% dari spreadsheet)
    let allApps = [];
    let activeCategory = 'ALL';

    /* =====================================================================
     * 3. AMBIENT PARTICLE BACKGROUND ANIMATION ENGINE
     * ===================================================================== */
    const canvas = document.getElementById('ambient-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function setupCanvasSize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', setupCanvasSize);
    setupCanvasSize();

    class AmbientDot {
      constructor() {
        this.init();
      }
      init() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2.2 + 0.6;
        this.vx = (Math.random() - 0.5) * 0.35;
        this.vy = (Math.random() - 0.5) * 0.35;
        this.alpha = Math.random() * 0.45 + 0.15;
      }
      step() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
          this.init();
        }
      }
      render() {
        ctx.fillStyle = `rgba(129, 140, 248, ${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 35; i++) particles.push(new AmbientDot());

    function loopCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.step();
        p.render();
      });
      requestAnimationFrame(loopCanvas);
    }
    loopCanvas();

    /* =====================================================================
     * 4. JAM DIGITAL & UI RENDERING ENGINE
     * ===================================================================== */
    function runLiveClock() {
      const clockEl = document.getElementById('live-clock');
      function update() {
        const now = new Date();
        clockEl.textContent = now.toLocaleDateString('id-ID', {
          weekday: 'long', day: 'numeric', month: 'short', year: 'numeric',
          hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
      }
      setInterval(update, 1000);
      update();
    }
    runLiveClock();

    function renderCategoryTabs() {
      const categories = ['ALL', ...new Set(allApps.map(a => a.category).filter(Boolean))];
      const container = document.getElementById('categoryTabs');
      container.innerHTML = categories.map(cat => `
        <button onclick="changeCategory('${cat}')" 
          class="px-4 py-2 rounded-xl font-bold whitespace-nowrap transition-all duration-200 ${
            cat === activeCategory 
              ? 'bg-indigo-600 text-white shadow-emboss-btn border-transparent scale-100' 
              : 'bg-slate-900/70 text-slate-400 hover:text-white border border-white/5 hover:border-white/10 active:scale-95'
          }">
          ${cat === 'ALL' ? 'Semua Kategori' : cat}
        </button>
      `).join('');
    }

    function changeCategory(cat) {
      activeCategory = cat;
      renderCategoryTabs();
      renderAppCards();
    }

    // Tracker Klik Aplikasi (Bekerja di Background tanpa mengganggu navigasi)
    function trackClick(appName) {
      const trackUrl = `${GAS_ENDPOINT}?action=click_track&app_name=${encodeURIComponent(appName)}&sid=${RUNTIME_SID}`;
      if (navigator.sendBeacon) {
        navigator.sendBeacon(trackUrl);
      } else {
        fetch(trackUrl, { keepalive: true, mode: 'no-cors' }).catch(() => {});
      }
      return true;
    }

    function renderAppCards() {
      const searchKey = (document.getElementById('searchInput').value || '').toLowerCase();
      const grid = document.getElementById('appGrid');
      const filtered = allApps.filter(item => {
        const matchCat = activeCategory === 'ALL' || (item.category && item.category.toUpperCase() === activeCategory.toUpperCase());
        const matchKey = (item.title || '').toLowerCase().includes(searchKey) || (item.desc || '').toLowerCase().includes(searchKey);
        return matchCat && matchKey;
      });

      document.getElementById('total-apps').textContent = `${allApps.length} Layanan Aktif`;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-12 text-center text-slate-400 card-emboss rounded-3xl">
            <i data-lucide="search-x" class="w-12 h-12 mx-auto mb-3 opacity-30 text-indigo-400"></i>
            <p class="text-sm font-semibold">Tidak ada layanan atau aplikasi yang sesuai.</p>
          </div>`;
        lucide.createIcons();
        return;
      }

      grid.innerHTML = filtered.map(app => `
        <a href="${app.url}" target="_blank" rel="noopener noreferrer" 
           onclick="trackClick('${app.title}')"
           class="group p-5 rounded-2xl card-emboss backdrop-blur-xl flex flex-col justify-between active:scale-[0.98]">
          <div class="flex items-start justify-between gap-3 mb-3">
            <div class="flex items-center gap-3">
              <div class="p-3 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 group-hover:bg-indigo-600 group-hover:text-white shadow-emboss-btn transition-all duration-300">
                <i data-lucide="${app.icon || 'external-link'}" class="w-5 h-5"></i>
              </div>
              <div>
                <h3 class="font-bold text-slate-100 text-sm group-hover:text-indigo-300 transition-colors">${app.title}</h3>
                <span class="text-[10px] text-slate-400 uppercase tracking-widest font-semibold">${app.category || 'Layanan'}</span>
              </div>
            </div>
            ${app.badge ? `<span class="text-[10px] px-2.5 py-1 rounded-md font-bold bg-white/5 text-indigo-300 border border-indigo-500/20 shadow-emboss-btn">${app.badge}</span>` : ''}
          </div>
          <p class="text-xs text-slate-400 line-clamp-2 leading-relaxed mb-4">${app.desc || ''}</p>
          <div class="flex items-center text-[11px] font-semibold text-slate-400 group-hover:text-indigo-400 transition-colors gap-1 self-end mt-auto">
            <span>Akses Aplikasi</span>
            <i data-lucide="arrow-up-right" class="w-3.5 h-3.5 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform"></i>
          </div>
        </a>
      `).join('');
      lucide.createIcons();
    }

    /* =====================================================================
     * 5. SINKRONISASI PENGATURAN SPREADSHEET (BACKGROUND & THEME)
     * ===================================================================== */
    function applySpreadsheetSettings(settings) {
      if (!settings) return;

      if (settings.title) {
        document.getElementById('app-title').textContent = settings.title;
        document.getElementById('page-title').textContent = settings.title;
      }
      if (settings.subtitle) document.getElementById('app-subtitle').textContent = settings.subtitle;
      
      if (settings.logo_url) {
        const logo = document.getElementById('app-logo');
        logo.src = settings.logo_url;
        logo.classList.remove('opacity-0');
      }

      if (settings.wa_group_url) document.getElementById('waGroupLink').href = settings.wa_group_url;
      if (settings.wa_group_text) document.getElementById('waGroupTitle').textContent = settings.wa_group_text;
      if (settings.footer) document.getElementById('footer-text').textContent = settings.footer;

      // Dynamic Background Engine: Otomatis memutar Video jika link video, atau Gambar/Warna Hidup
      const bodyEl = document.getElementById('body-container');
      const bgVideoWrapper = document.getElementById('bg-video-wrapper');
      const bgVideo = document.getElementById('bg-video');

      if (settings.bg_body) {
        const val = settings.bg_body.trim();

        // 1. Jika bernilai URL Video Direct (.mp4 / .webm)
        if (val.match(/\.(mp4|webm|ogg)$/i)) {
          bgVideo.src = val;
          bgVideoWrapper.style.display = "block";
          bodyEl.style.background = "transparent";
        } 
        // 2. Jika bernilai URL Gambar Web
        else if (val.startsWith("http")) {
          bgVideoWrapper.style.display = "none";
          bodyEl.style.backgroundImage = `radial-gradient(circle at 50% 0%, rgba(3, 7, 18, 0.75) 0%, rgba(3, 7, 18, 0.95) 100%), url('${val}')`;
          bodyEl.style.backgroundSize = "cover";
          bodyEl.style.backgroundPosition = "center";
          bodyEl.style.backgroundAttachment = "fixed";
        } 
        // 3. Jika berupa Kode Warna / Gradient CSS (Contoh: linear-gradient / #0b1120)
        else {
          bgVideoWrapper.style.display = "none";
          bodyEl.style.background = val;
        }
      }

      // Kustomisasi Header Background jika diisi
      if (settings.bg_header) {
        document.getElementById('main-header').style.background = settings.bg_header;
      }
    }

    function syncAnalyticsUI(analytics) {
      if (!analytics) return;
      if (analytics.total !== undefined) {
        document.getElementById('stat-total').textContent = Number(analytics.total).toLocaleString('id-ID');
      }
      if (analytics.online !== undefined) {
        const el = document.getElementById('stat-online');
        el.textContent = Number(analytics.online).toLocaleString('id-ID');
      }
    }

    /* =====================================================================
     * 6. KOMUNIKASI API NETWORK (FETCH INITIAL & HEARTBEAT SYNC)
     * ===================================================================== */
    async function fetchPortalDatabase() {
      try {
        const ua = encodeURIComponent(navigator.userAgent);
        const res = await fetch(`${GAS_ENDPOINT}?action=init&sid=${RUNTIME_SID}&ua=${ua}`, {
          method: 'GET',
          redirect: 'follow'
        });
        const data = await res.json();

        if (data.status === "success") {
          applySpreadsheetSettings(data.settings);
          syncAnalyticsUI(data.analytics);

          if (data.apps && data.apps.length > 0) {
            allApps = data.apps;
            renderCategoryTabs();
            renderAppCards();
          }
          document.getElementById('sync-status').textContent = "Live Sync";
        }
      } catch (err) {
        document.getElementById('sync-status').textContent = "Terhubung Lokal";
      }
    }

    // Heartbeat Pengunjung (Setiap 20 detik tanpa membebani server)
    setInterval(async () => {
      try {
        const res = await fetch(`${GAS_ENDPOINT}?action=heartbeat&sid=${RUNTIME_SID}`, {
          method: 'GET',
          redirect: 'follow'
        });
        const data = await res.json();
        if (data.status === "success" && data.analytics) {
          syncAnalyticsUI(data.analytics);
          document.getElementById('sync-status').textContent = "Live Sync";
        }
      } catch (e) {
        document.getElementById('sync-status').textContent = "Reconnecting";
      }
    }, 20000);

    // Initial Event Listeners & Boot
    document.getElementById('searchInput').addEventListener('input', renderAppCards);
    lucide.createIcons();
    fetchPortalDatabase();
  </script>
</body>
</html>
